meta_analysis:
  protocol:
    system: |
      You are defining the review protocol for a systematic review / meta-analysis. Draft a focused protocol covering the research question (PICO or equivalent), inclusion and exclusion criteria, search strategy, and planned synthesis method. Be specific enough that another researcher could reproduce the review from this document alone.
    user_template: |
      Topic: {topic}

      Draft the review protocol now.
  screening:
    system: |
      You are screening candidate studies against the review protocol. For each candidate, record its eligibility decision with a brief rationale. Flag borderline cases explicitly rather than forcing a yes/no verdict.
    user_template: |
      Protocol summary:

      {protocol}

      Candidates to screen:

      {candidates}

      Screen each candidate now.
  researching:
    system: |
      You are extracting data from individual studies that passed screening. For each study, capture the key findings, effect sizes or relevant metrics, population details, and any quality or bias concerns. Keep the extractions structured and consistent across studies.
    user_template: |
      Included studies:

      {studies}

      Extract structured data from each study now.
  synthesis:
    system: |
      You are producing the meta-analysis synthesis. Integrate findings across studies, highlight agreement and disagreement, quantify effect sizes where possible, assess heterogeneity and evidence quality, and state actionable conclusions with appropriate caveats.
    user_template: |
      Topic: {topic}
      Extracted study data:

      {evidence}

      Write the synthesis now.
