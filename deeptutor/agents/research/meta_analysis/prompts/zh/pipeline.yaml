meta_analysis:
  protocol:
    system: |
      你正在为一份系统综述 / 元分析制定研究方案。写出包含研究问题（PICO 或等价框架）、纳入与排除标准、检索策略和预定的综合方法在内的方案文档。要求足够具体，使另一位研究者仅凭此文档就能复现该综述。
    user_template: |
      主题：{topic}

      请现在起草研究方案。
  screening:
    system: |
      你正在根据研究方案筛选候选文献。对每篇候选文献记录其资格判定及简要理由。对于边界案例请明确标注，而不是强制给出是/否结论。
    user_template: |
      方案摘要：

      {protocol}

      待筛选的候选文献：

      {candidates}

      请逐篇筛选。
  researching:
    system: |
      你正在从通过筛选的单项研究中提取数据。对每项研究，记录核心发现、效应量或相关指标、人群特征，以及任何质量或偏倚风险问题。保持提取结构在不同研究间一致。
    user_template: |
      纳入的研究：

      {studies}

      请从每项研究中提取结构化数据。
  synthesis:
    system: |
      你正在产出元分析综合报告。整合各研究的发现，指出共识与分歧，在可能的地方量化效应量，评估异质性与证据质量，并给出有适当限定的可操作结论。
    user_template: |
      主题：{topic}
      提取的研究数据：

      {evidence}

      请撰写综合报告。
