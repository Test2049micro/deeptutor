[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deeptutor"
version = "1.6.11"
description = "An agent-native intelligent learning companion with multi-agent collaboration and RAG"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.15"
readme = "README.md"
authors = [{ name = "DeepTutor Authors" }]
keywords = ["education", "llm", "agent", "rag", "learning"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
    "openai>=1.30.0",
    "tiktoken>=0.5.0",
    "aiohttp>=3.9.4",
    "httpx>=0.27.0",
    "requests>=2.32.2",
    "ddgs>=9.9.1",
    "nest_asyncio>=1.5.8",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "aiosqlite>=0.19.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.36",
    "pyte>=0.8.1",
    "mcp>=1.26.0,<2.0.0",
    "pageindex>=0.2.10,<0.3.0",
    "qrcode>=7.4.0,<9.0.0",
    "anthropic>=0.30.0",
    "dashscope>=1.14.0",
    "perplexityai>=0.1.0",
    "oauth-cli-kit>=0.1.1",
    "llama-index>=0.14.12",
    "llama-index-retrievers-bm25>=0.7.1,<0.8.0; python_version < '3.14'",
    "llama-index-vector-stores-faiss>=0.4.0,<1.0.0",
    "faiss-cpu>=1.8.0,<2.0.0; python_version < '3.14'",
    "faiss-cpu>=1.12.0,<2.0.0; python_version >= '3.14'",
    "PyMuPDF>=1.26.0",
    "numpy>=1.24.0,<3.0.0",
    "arxiv>=2.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.0.0",
    "defusedxml>=0.7.1",
    "youtube-transcript-api>=1.2.0,<2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pocketbase>=0.12.0",
    "redis>=5.0.0,<7.0.0",
    "loguru>=0.7.3,<1.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "croniter>=6.0.0,<7.0.0",
    "psutil>=5.9.0,<8.0.0",
]

[project.optional-dependencies]
cli = [
    "anthropic>=0.30.0",
    "dashscope>=1.14.0",
    "perplexityai>=0.1.0",
    "oauth-cli-kit>=0.1.1",
    "pageindex>=0.2.10,<0.3.0",
    "llama-index>=0.14.12",
    "llama-index-retrievers-bm25>=0.7.1,<0.8.0; python_version < '3.14'",
    "llama-index-vector-stores-faiss>=0.4.0,<1.0.0",
    "faiss-cpu>=1.8.0,<2.0.0; python_version < '3.14'",
    "faiss-cpu>=1.12.0,<2.0.0; python_version >= '3.14'",
    "PyMuPDF>=1.26.0",
    "numpy>=1.24.0,<3.0.0",
    "arxiv>=2.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.0.0",
    "defusedxml>=0.7.1",
    "youtube-transcript-api>=1.2.0,<2.0.0",
]
server = [
    "deeptutor[cli]",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pocketbase>=0.12.0",
    "redis>=5.0.0,<7.0.0",
    "loguru>=0.7.3,<1.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "croniter>=6.0.0,<7.0.0",
    "psutil>=5.9.0,<8.0.0",
]
partners = [
    "deeptutor[server]",
    "python-telegram-bot[socks]>=22.6,<23.0",
    "wecom-aibot-sdk>=1.0.8,<2.0.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "dingtalk-stream>=0.24.0,<1.0.0",
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0",
    "socksio>=1.1.0,<2.0.0",
    "websocket-client>=1.9.0,<2.0.0",
    "zulip>=0.8.0,<1.0.0",
    "websockets>=12.0",
    "aiohttp>=3.10.0,<4.0.0",
    "PyJWT[crypto]>=2.8.0,<3.0.0",
]
all = ["deeptutor[cli,server,partners]"]

[project.scripts]
deeptutor = "deeptutor_cli.main:main"
deeptutor-export-frontend-contracts = "deeptutor.api.contracts.export:main"

[project.entry-points."deeptutor.reading_extensions"]
guided_learning = "deeptutor.reading.study_guidance:StudyGuidanceExtension"
quiz = "deeptutor.reading.quiz:ReadingQuizExtension"
read_aloud = "deeptutor.reading.read_aloud:ReadAloudExtension"
translation = "deeptutor.reading.translation:TranslationExtension"
vocabulary = "deeptutor.reading.vocabulary:VocabularyExtension"

[tool.setuptools.packages.find]
where = ["."]
include = ["deeptutor*", "deeptutor_cli*", "deeptutor_web*"]

[tool.setuptools.package-data]
deeptutor_web = [".next/**", "public/**", "node_modules/**", "BUILD_INFO", "package.json", "server.js"]
